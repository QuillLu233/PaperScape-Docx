[package]
name = "paperscape"
version = "0.5.0"
description = "PaperScape 纸境 —— 安静、轻量的桌面写作空间"
authors = ["PaperScape"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "paperscape_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
